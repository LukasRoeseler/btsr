  <rect x="0" y="14" width="64" height="5" fill="#ffffff"/>
  <rect x="0" y="45" width="64" height="5" fill="#b3131f"/>
  <text x="32" y="40" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="21"
        fill="#ffffff">CH</text>
</svg>
