<svg xmlns="http://www.w3.org/2000/svg"
     width="297.01mm" height="210.02mm" viewBox="0 0 297.01 210.02">
  <!--
    RECHTSKURVE, 60 GRAD, RADIALE TRAPEZ-KEILE, KEIN STRICHCODE-ANSPRUCH.
    A4 QUER, 1 SVG-Einheit = 1 mm. Experimentell, zum Auslegen und
    Vergleichen mit einer Infrarot-Aufnahme.

        Version A, randlos: Aussenradius so gewaehlt, dass die Sehne ueber den
    vollen 60-Grad-Winkel genau die Blattbreite ergibt; Innenradius so, dass
    die Innenkante ebenfalls die Blattoberkante beruehrt. Der Sektor fuellt
    damit die ganze Seite, OHNE ueber sie hinauszugehen.
    Aussenradius 297.0 mm, Innenradius 100.4 mm.

    8 Keile, jeder ein TRAPEZ mit unabhaengig vorgegebener Innenbreite
    (5 mm) und Aussenbreite (20 mm) - dieselben zwei Zahlen wie bei
    der Geraden (5/20 mm), grob am Foto geschaetzt (CARRERA_HYBRID.md:
    eine genauere Herleitung ist dort bereits gescheitert dokumentiert,
    31.08.). Anders als ein Kreissektor bei konstantem Winkel trifft das
    beide Breiten unabhaengig, nicht nur die eine mit der anderen
    rechnerisch aus dem Radienverhaeltnis.

    DRUCKEN: 100 % / "Tatsaechliche Groesse", NICHT "an Seite anpassen".
  -->
