  <text x="148.5" y="180" font-family="sans-serif" font-size="3.2" text-anchor="middle" fill="#000000">100 mm Kontrollmaß: nachmessen. Stimmt es nicht, wurde skaliert gedruckt und das Muster ist ungültig.</text>

  <text x="13.5" y="191" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#000000">Aufbau aller Spalten:</text>
  <text x="13.5" y="196" font-family="sans-serif" font-size="3.0" fill="#333333">Taktung (101010) + 7-Bit Payload (Start 1 + 4-Bit Daten + Parität + Stop 1) + Trennung (00) + 7-Bit Payload Wiederholung</text>
  <text x="13.5" y="201" font-family="sans-serif" font-size="3.0" fill="#333333">Wichtig: Beim Drucken "Tatsächliche Größe" / "100 %" wählen (keine Anpassung an Druckbereich).</text>
