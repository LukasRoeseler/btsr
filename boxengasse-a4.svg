<svg xmlns="http://www.w3.org/2000/svg"
     width="297mm" height="210mm" viewBox="0 0 297 210">
  <!--
    Boxengassen-Markierung. DIN A4 QUER, 1 SVG-Einheit = 1 mm.
    Drucken: 100 % / "Tatsächliche Größe", Querformat, NICHT "an Seite anpassen".

    Geometrie bewusst aus dem Start/Ziel-Blatt übernommen (dort nachgemessen):
    Balkenlänge 277 mm quer zur Fahrtrichtung, Balkendicke 4 mm, schmale Lücke 4 mm,
    breite Lücke 7,2 mm, Band beginnt 49,4 mm von der Oberkante. Nur die Abfolge der
    Lücken ist anders — das ist vermutlich die eigentliche Nutzlast.

    Start/Ziel-Abfolge:  schmal breit breit schmal breit schmal schmal schmal
    Dieses Blatt:        breit schmal schmal breit schmal breit schmal schmal

    EHRLICHE EINSCHRÄNKUNG: ob das Auto genau hierfür einen eigenen Code meldet, ist
    NICHT bestätigt. Die Kodierung ist unbekannt. Nach dem Drucken einmal darüber fahren
    und in der App unter Strecke -> Boxengasse ablesen, was die Muster-Sonde anzeigt;
    genau diesen Wert dann als Auslöse-Code eintragen. Zeigt die Sonde nichts, erkennt
    das Auto das Muster nicht.

    Der Pfeil zeigt in die Fahrtrichtung.
  -->

  <rect x="0" y="0" width="297" height="210" fill="#ffffff"/>

  <g fill="#000000">
    <rect x="10" y="49.4"  width="277" height="4"/>
    <rect x="10" y="60.6"  width="277" height="4"/>
    <rect x="10" y="68.6"  width="277" height="4"/>
    <rect x="10" y="76.6"  width="277" height="4"/>
    <rect x="10" y="87.8"  width="277" height="4"/>
    <rect x="10" y="95.8"  width="277" height="4"/>
    <rect x="10" y="107.0" width="277" height="4"/>
    <rect x="10" y="115.0" width="277" height="4"/>
    <rect x="10" y="123.0" width="277" height="4"/>
  </g>

  <!-- Fahrtrichtungspfeil, mittig unter dem Band wie beim Start/Ziel-Blatt -->
  <g fill="#000000">
    <path d="M 148.5 134 L 134 156 L 142 156 L 142 174 L 155 174 L 155 156 L 163 156 Z"/>
  </g>

  <text x="148.5" y="192" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="4.5" fill="#000000">
    BOXENGASSE — A4 quer, 100 % drucken, nicht skalieren
  </text>
</svg>
