  <text x="98.50" y="252.24" font-family="sans-serif" font-size="3.2" fill="#000">100 mm Kontrollmass: nachmessen. Stimmt es nicht, wurde skaliert gedruckt und das Muster ist ungueltig.</text>
  <text x="8" y="263.24" font-family="sans-serif" font-size="4.2" fill="#000">BOXENGASSE, Katalognummer 14 (0x0e)</text>
  <text x="8" y="269.24" font-family="sans-serif" font-size="3.2" fill="#000">Gebaut nach beiden Regeln, die das bekannte Muster erklaeren: Abstand der dicken Balken = 14, Zahl der breiten Luecken = 14. Modulmass wie das Original. Wenn eine der beiden Regeln gilt, meldet das Auto 0x0e.</text>
