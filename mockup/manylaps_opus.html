<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManyLaps · Omega Labs</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131824; --panel2:#1a2132; --line:#263049;
    --text:#e8ecf4; --muted:#8b95ab; --accent:#ff6b1a; --accent2:#ff9a5a;
    --gold:#f5c542; --ok:#3ccf91; --lock:#5b6478; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:
    radial-gradient(1200px 500px at 80% -100px,#ff6b1a22,transparent 60%),var(--bg);
    color:var(--text);min-height:100vh;line-height:1.45}
  button{font:inherit;cursor:pointer;border:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* Header */
  header{position:sticky;top:0;z-index:20;background:#0b0e14e6;backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;gap:18px;height:64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px}
  .omega{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#c43d00);font-size:20px}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
  nav{display:flex;gap:4px;margin-left:24px}
  nav button{background:none;color:var(--muted);padding:8px 14px;border-radius:9px;font-weight:600}
  nav button.active,nav button:hover{color:var(--text);background:var(--panel2)}
  .hright{margin-left:auto;display:flex;align-items:center;gap:12px}
  .medalcount{display:flex;align-items:center;gap:6px;background:var(--panel2);padding:6px 12px;
    border-radius:999px;font-weight:700;border:1px solid var(--line)}
  .medalcount.bump{animation:bump .6s}
  @keyframes bump{40%{transform:scale(1.25);border-color:var(--gold)}}
  .lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .lang button{background:none;color:var(--muted);padding:6px 10px;font-weight:700;font-size:13px}
  .lang button.active{background:var(--accent);color:#fff}

  /* Hero */
  .hero{padding:36px 0 18px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end}
  .hero h1{font-size:34px;line-height:1.15;margin-bottom:8px}
  .hero h1 span{color:var(--accent)}
  .hero p{color:var(--muted);max-width:560px}
  .progress{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .progress .lbl{font-size:13px;color:var(--muted);margin-bottom:10px}
  .bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));
    border-radius:99px;transition:width .8s}
  .progress .nums{display:flex;justify-content:space-between;margin-top:10px;font-weight:700}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 26px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start}
  .step b{display:grid;place-items:center;min-width:28px;height:28px;border-radius:50%;
    background:var(--panel2);color:var(--accent2);font-size:14px}
  .step h4{font-size:14px;margin-bottom:2px}
  .step p{font-size:13px;color:var(--muted)}

  /* Cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;padding-bottom:30px}
  .card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;
    gap:12px;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:#3a4766}
  .card.done{border-color:#2c6b52}
  .card.locked{opacity:.55}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start}
  .icon{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;
    background:var(--bg);border:1px solid var(--line)}
  .ribbon{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:5px 9px;border-radius:7px}
  .ribbon.sug{background:#ff6b1a26;color:var(--accent2);border:1px solid #ff6b1a55}
  .ribbon.ok{background:#3ccf9122;color:var(--ok);border:1px solid #3ccf9155}
  .ribbon.lk{background:#5b647833;color:var(--muted);border:1px solid var(--line)}
  .card h3{font-size:20px}
  .desc{color:var(--muted);font-size:14px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
  .medalrow{letter-spacing:1px}
  .medalrow .dim{filter:grayscale(1);opacity:.35}
  .reqs{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
  .chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .chip.warn{color:var(--accent2);border-color:#ff6b1a55}
  .btn{background:var(--accent);color:#fff;font-weight:700;padding:11px 16px;border-radius:10px;transition:background .15s}
  .btn:hover{background:#ff7f38}
  .btn:disabled{background:var(--panel2);color:var(--lock);cursor:not-allowed}
  .btn.ghost{background:var(--panel2);color:var(--text)}
  .btn.ghost:hover{background:#232c42}
  .note{font-size:13px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);
    border-radius:10px;padding:12px 14px;margin-bottom:18px}

  /* Leaderboard */
  .section-title{font-size:26px;margin:34px 0 6px}
  .sub{color:var(--muted);margin-bottom:20px}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs button{background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-weight:700}
  .tabs button.active{color:#fff;background:var(--accent);border-color:var(--accent)}
  .board{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:30px}
  .board .cap{padding:14px 18px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 18px;border-bottom:1px solid #1e2638;font-size:15px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
  td.num{font-variant-numeric:tabular-nums;font-weight:700}
  tr.me td{background:#ff6b1a18}
  tr.me td:first-child{box-shadow:inset 3px 0 var(--accent)}
  .pos{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--panel2);font-weight:800;font-size:13px}
  .p1{background:#f5c54233;color:var(--gold)} .p2{background:#c9d1e033;color:#dfe5ef} .p3{background:#cd7f3233;color:#e09a5c}
  .youtag{font-size:11px;font-weight:800;background:var(--accent);color:#fff;padding:2px 6px;border-radius:5px;margin-left:6px}
  .lockpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:50px 20px;text-align:center;margin-bottom:30px}
  .lockpanel .big{font-size:44px;margin-bottom:10px}
  .lockpanel p{color:var(--muted);max-width:480px;margin:6px auto 18px}

  /* Profile */
  .pgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin-bottom:30px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .panel h3{margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:9px;font:inherit;margin-bottom:14px}
  .toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
  .toggle input{width:18px;height:18px;accent-color:var(--accent)}
  .case{display:grid;gap:10px}
  .caseitem{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px;
    background:var(--bg);border:1px solid var(--line)}
  .caseitem.pending{opacity:.45}
  .caseitem small{color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:12px;color:var(--muted)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:#05070bcc;display:none;place-items:center;z-index:50;padding:20px}
  .overlay.open{display:grid}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:500px;width:100%;padding:26px;
    animation:pop .2s ease-out}
  @keyframes pop{from{transform:scale(.95);opacity:0}}
  .modal h2{margin-bottom:6px}
  .modal .muted{color:var(--muted);font-size:14px;margin-bottom:16px}
  .checks{display:grid;gap:10px;margin:14px 0 18px}
  .actions{display:flex;gap:10px;justify-content:flex-end}
  .dev{font-family:ui-monospace,monospace;font-size:11px;color:var(--lock);margin-top:14px;word-break:break-all}
  .stage{text-align:center;padding:16px 0}
  .stage .bar{margin:18px 0 10px}
  .reward{text-align:center;padding:10px 0}
  .reward .medals{font-size:40px;letter-spacing:6px;margin:14px 0}
  .reward .medals span{display:inline-block;animation:drop .5s backwards}
  @keyframes drop{from{transform:translateY(-30px) scale(.4);opacity:0}}

  footer{border-top:1px solid var(--line);padding:18px 0 30px;color:var(--lock);font-size:12px}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .mock{background:#f5c54222;color:var(--gold);padding:3px 8px;border-radius:6px;font-weight:700;margin-right:8px}

  @media(max-width:820px){
    .hero{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.pgrid{grid-template-columns:1fr}
    nav{margin-left:0}.brand small{display:none}.hbar{gap:10px}nav button{padding:8px 9px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="brand"><div class="omega">Ω</div><div>ManyLaps<small>Omega Labs</small></div></div>
    <nav id="nav"></nav>
    <div class="hright">
      <div class="medalcount" id="medalcount">🏅 <span>0</span></div>
      <div class="lang" id="lang"><button data-lang="de">DE</button><button data-lang="en">EN</button></div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<footer>
  <div class="wrap">
    <div><span class="mock">MOCKUP</span><span id="foot"></span></div>
    <button class="btn ghost" id="reset" style="padding:7px 12px;font-size:12px"></button>
  </div>
</footer>

<script>
/* ---------- Study catalogue (neutral names; internal module codes stay hidden) ---------- */
const STUDIES = [
  { id:'goal',     name:'Ridge Run',       icon:'⛰️', min:18, req:['desktop'] },
  { id:'triplett', name:'Lakeside Loop',   icon:'🌊', min:23, req:['desktop'] },
  { id:'fischer',  name:'Paddock Session', icon:'🧩', min:24, req:['desktop'], firstOnly:true },
  { id:'brodsky',  name:'Night Circuit',   icon:'🌙', min:25, req:['desktop','headphones'] },
  { id:'strayer',  name:'Coastal Run',     icon:'📡', min:27, req:['desktop','headphones','mic'] },
  { id:'hothand',  name:'Sprint Series',   icon:'⚡', min:32, req:['desktop'] },
];
// Medals reflect time invested only (never performance): <=20 min: 3 | 21-26: 4 | >=27: 5
const medalsFor = m => m <= 20 ? 3 : m <= 26 ? 4 : 5;
STUDIES.forEach(s => s.medals = medalsFor(s.min));
const MAX_MEDALS = STUDIES.reduce((a, s) => a + s.medals, 0);
// Recruitment weights from the power analysis -> used only for the "Suggested" badge
const WEIGHTS = { triplett:252, hothand:188, fischer:588, strayer:175, brodsky:292, goal:214 };

/* ---------- Texts ---------- */
const T = {
en:{

  hero_title:'Pick your next <span>drive</span>.',
  hero_sub:'Each study is a short, self-contained session in the Omega simulator. Do them in any order, on any day, whenever you have time.',

  req_desktop:'Desktop/laptop', req_headphones:'Headphones', req_mic:'Microphone',
  suggested:'Suggested', completed:'Completed', locked:'Locked',
  first_only:'Available as first study only', start:'Start study', earned:'{m} medals earned',
  unavailable:'Not available',
  break_hint:'Tip: take a break of at least an hour between studies. Your progress is saved.',
  d_goal:'A series of laps on the main circuit with a short questionnaire.',
  d_triplett:'Several blocks of laps on the main circuit. Sometimes another car is on track.',
  d_fischer:'A mixed session: a short game, a decision task, then a few laps.',

  board_locked_d:'Rankings become visible once you have completed one study.',
  board_go:'Choose a study',
  tab_lap:'⏱ Best lap', tab_medals:'🏅 Most medals',
  cap_lap:'Fastest valid lap on the main circuit (ML Track A), across all sessions.',
  cap_medals:'Medals for participation. Ties are broken by number of completed studies.',
  col_rank:'#', col_driver:'Driver', col_lap:'Best lap', col_medals:'Medals', col_studies:'Studies',
  you:'YOU', hidden_note:'You are hidden from the leaderboard (see “My medals”).',
  prof_title:'My medals', nick:'Leaderboard name (no real names)', visible:'Show me on the leaderboard',
  case_title:'Medal case', stat_medals:'Medals', stat_studies:'Studies', stat_best:'Best lap',
  pending:'Not yet completed',
  m_title:'Start “{name}”?', m_sub:'About {min} minutes · {medals} medals on completion',
  m_time:'I have about {min} minutes without interruptions.',
  m_desktop:'I am using a desktop or laptop computer.',
  m_headphones:'I am wearing headphones.', m_mic:'I allow microphone access (audio stays on my device).',
  cancel:'Cancel', go:'Start', st1:'Loading circuit…', st2:'Driving…', st3:'Saving data…',
  done_t:'Study complete!', done_d:'“{name}” has been added to your medal case.', back:'Back to studies',
  reset:'Reset demo', foot:'Studies are simulated. In production, “Start” opens the ManyLaps app.'
},
de:{
  nav_studies:'Studien', nav_board:'Rangliste', nav_profile:'Meine Medaillen',
  hero_title:'Wählen Sie Ihre nächste <span>Fahrt</span>.',
  hero_sub:'Jede Studie ist eine kurze, abgeschlossene Sitzung im Omega-Simulator. Sie können sie in beliebiger Reihenfolge und an beliebigen Tagen absolvieren, wann immer Sie Zeit haben.',
  progress:'Ihr Fortschritt', studies_of:'{d} / {n} Studien', medals_of:'{m} / {M} Medaillen',
  s1_t:'Beliebige Studie wählen', s1_d:'Keine feste Reihenfolge. Kommen Sie wieder, wann Sie möchten.',
  s2_t:'Jede Studie einmal', s2_d:'Abgeschlossene Studien bleiben in Ihrer Medaillensammlung.',

  min:'Min.', first_visit:'Ihre erste Studie enthält einmalig ein Profil von ca. 8 Min. (Fragen und ein kurzes Reaktionsspiel).',
  rule:'Medaillen: 3 für Studien bis 20 Min. · 4 für 21–26 Min. · 5 ab 27 Min.',
  req_desktop:'Desktop/Laptop', req_headphones:'Kopfhörer', req_mic:'Mikrofon',
  suggested:'Empfohlen', completed:'Abgeschlossen', locked:'Gesperrt',
  first_only:'Nur als erste Studie verfügbar', start:'Studie starten', earned:'{m} Medaillen erhalten',
  unavailable:'Nicht verfügbar',

  d_fischer:'Eine gemischte Sitzung: ein kurzes Spiel, eine Entscheidungsaufgabe, danach einige Runden.',
  d_brodsky:'Runden auf der Hauptstrecke mit unterschiedlichen Audio-Einstellungen.',
  d_strayer:'Runden mit einer zusätzlichen Aufgabe auf dem Bildschirm und über Kopfhörer. Audio wird nur auf Ihrem Gerät ausgewertet und nie aufgezeichnet.',
  d_hothand:'48 kurze Sprints aus dem Stand, mit einem kleinen Punktespiel zwischen den Läufen.',
  board_title:'Omega Labs Rangliste', board_sub:'Pseudonyme Ranglisten aller ManyLaps-Fahrerinnen und -Fahrer.',
  board_locked_t:'Wird nach Ihrer ersten Studie freigeschaltet',
  board_locked_d:'Die Ranglisten werden sichtbar, sobald Sie eine Studie abgeschlossen haben.',
  board_go:'Studie wählen',
  tab_lap:'⏱ Beste Runde', tab_medals:'🏅 Meiste Medaillen',
  cap_lap:'Schnellste gültige Runde auf der Hauptstrecke (ML Track A), über alle Sitzungen.',
  cap_medals:'Medaillen für die Teilnahme. Bei Gleichstand entscheidet die Zahl abgeschlossener Studien.',
  col_rank:'#', col_driver:'Name', col_lap:'Beste Runde', col_medals:'Medaillen', col_studies:'Studien',
  you:'SIE', hidden_note:'Sie sind in der Rangliste ausgeblendet (siehe „Meine Medaillen“).',
  prof_title:'Meine Medaillen', nick:'Name in der Rangliste (keine Klarnamen)', visible:'In der Rangliste anzeigen',
  case_title:'Medaillensammlung', stat_medals:'Medaillen', stat_studies:'Studien', stat_best:'Beste Runde',
  pending:'Noch nicht abgeschlossen',
  m_title:'„{name}“ starten?', m_sub:'Ca. {min} Minuten · {medals} Medaillen bei Abschluss',
  m_time:'Ich habe ca. {min} Minuten ungestört Zeit.',
  m_desktop:'Ich nutze einen Desktop-Computer oder Laptop.',
  m_headphones:'Ich trage Kopfhörer.', m_mic:'Ich erlaube den Mikrofonzugriff (Audio bleibt auf meinem Gerät).',
  cancel:'Abbrechen', go:'Starten', st1:'Strecke wird geladen…', st2:'Fahrt läuft…', st3:'Daten werden gespeichert…',
  done_t:'Studie abgeschlossen!', done_d:'„{name}“ wurde Ihrer Medaillensammlung hinzugefügt.', back:'Zurück zu den Studien',
  reset:'Demo zurücksetzen', foot:'Studien werden simuliert. Im Betrieb öffnet „Starten“ die ManyLaps-App.'
}};

/* ---------- Fake leaderboard data ---------- */
const FAKE = [
  ['apex_anna',36912,25,6],['LateBraker',37455,21,5],['Nordschleife',37803,25,6],['slipstream',38120,12,3],
  ['Mira K.',38544,17,4],['torque_tom',38990,9,2],['Bergfahrt',39310,22,5],['pitwall_pia',39788,8,2],
  ['Drift König',40215,13,3],['Lea_R',40870,4,1],['RC_Max',41466,16,4],['kurvenkratzer',42301,5,1],
  ['quietcorner',43050,3,1],['Ω-rookie',44210,4,1]
].map(([name, lap, medals, studies]) => ({ name, lap, medals, studies }));

/* ---------- State ---------- */
const LS_KEY = 'manylaps_hub_mock_v1';
function pickSuggest(){
  let r = Math.random() * Object.values(WEIGHTS).reduce((a, b) => a + b, 0);
  for (const [k, w] of Object.entries(WEIGHTS)) { if ((r -= w) < 0) return k; }
  return 'goal';
}
function fresh(){
  return { lang:(navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en',
           done:{}, best:null, visible:true, tab:'studies', boardTab:'lap', suggest:pickSuggest(),
           nick:'Driver-' + Math.random().toString(16).slice(2, 6).toUpperCase() };
}
let S;
try { S = JSON.parse(localStorage.getItem(LS_KEY)) || fresh(); } catch(e) { S = fresh(); }
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} };

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(key, vars = {}){
  let s = (T[S.lang][key] ?? T.en[key] ?? key);
  for (const [k, v] of Object.entries(vars)) s = s.replaceAll('{' + k + '}', v);
  return s;
}
const fmtLap = ms => ms == null ? '–' : (ms / 1000).toFixed(3) + ' s';
const doneCount = () => Object.keys(S.done).length;
const totalMedals = () => Object.values(S.done).reduce((a, d) => a + d.medals, 0);
const medalRow = (n, earned = true) => Array.from({length:n}, () =>
  `<span class="${earned ? '' : 'dim'}">🏅</span>`).join('');

/* ---------- Render ---------- */
function render(){
  document.documentElement.lang = S.lang;
  $('nav').innerHTML = ['studies', 'board', 'profile'].map(v =>
    `<button data-tab="${v}" class="${S.tab === v ? 'active' : ''}">${t('nav_' + v)}</button>`).join('');
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === S.lang));
  $('medalcount').querySelector('span').textContent = totalMedals();
  $('foot').textContent = t('foot');
  $('reset').textContent = t('reset');
  $('main').innerHTML = S.tab === 'studies' ? viewStudies() : S.tab === 'board' ? viewBoard() : viewProfile();
}

function viewStudies(){
  const d = doneCount(), m = totalMedals();
  const cards = STUDIES.map(s => {
    const done = S.done[s.id];
    const locked = !done && s.firstOnly && d > 0;
    const sug = !done && !locked && S.suggest === s.id;
    const ribbon = done ? `<span class="ribbon ok">✓ ${t('completed')}</span>`
                 : locked ? `<span class="ribbon lk">🔒 ${t('locked')}</span>`
                 : sug ? `<span class="ribbon sug">★ ${t('suggested')}</span>` : '';
    const chips = s.req.map(r => `<span class="chip">${t('req_' + r)}</span>`).join('')
                + (s.firstOnly ? `<span class="chip warn">${t('first_only')}</span>` : '');
    const btn = done ? `<button class="btn" disabled>${t('earned', {m:done.medals})}</button>`
              : locked ? `<button class="btn" disabled>${t('unavailable')}</button>`
              : `<button class="btn" data-start="${s.id}">${t('start')} →</button>`;
    return `<article class="card ${done ? 'done' : ''} ${locked ? 'locked' : ''}">
      <div class="card-top"><div class="icon">${s.icon}</div>${ribbon}</div>
      <h3>${s.name}</h3>
      <p class="desc">${t('d_' + s.id)}</p>
      <div class="meta"><span>⏱ ≈ ${s.min} ${t('min')}</span><span class="medalrow">${medalRow(s.medals, !!done)}</span></div>
      <div class="reqs">${chips}</div>
      ${btn}
    </article>`;
  }).join('');
  return `
    <section class="hero">
      <div><h1>${t('hero_title')}</h1><p>${t('hero_sub')}</p></div>
      <div class="progress">
        <div class="lbl">${t('progress')}</div>
        <div class="bar"><i style="width:${100 * m / MAX_MEDALS}%"></i></div>
        <div class="nums"><span>${t('studies_of', {d, n:STUDIES.length})}</span><span>🏅 ${t('medals_of', {m, M:MAX_MEDALS})}</span></div>
      </div>
    </section>
    <div class="steps">
      <div class="step"><b>1</b><div><h4>${t('s1_t')}</h4><p>${t('s1_d')}</p></div></div>
      <div class="step"><b>2</b><div><h4>${t('s2_t')}</h4><p>${t('s2_d')}</p></div></div>
      <div class="step"><b>3</b><div><h4>${t('s3_t')}</h4><p>${t('s3_d')}</p></div></div>
    </div>
    <div class="note">ℹ️ ${d === 0 ? t('first_visit') + ' ' : ''}${t('rule')}${d > 0 ? '<br>☕ ' + t('break_hint') : ''}</div>
    <section class="grid">${cards}</section>`;
}

function viewBoard(){
  const head = `<h2 class="section-title">${t('board_title')}</h2><p class="sub">${t('board_sub')}</p>`;
  if (doneCount() === 0) return head + `
    <div class="lockpanel"><div class="big">🔒</div><h3>${t('board_locked_t')}</h3>
      <p>${t('board_locked_d')}</p><button class="btn" data-tab="studies">${t('board_go')}</button></div>`;
  const me = { name:S.nick, lap:S.best, medals:totalMedals(), studies:doneCount(), me:true };
  let rows = [...FAKE]; if (S.visible) rows.push(me);
  const lapMode = S.boardTab === 'lap';
  rows.sort(lapMode ? (a, b) => a.lap - b.lap : (a, b) => b.medals - a.medals || b.studies - a.studies);
  const body = rows.map((r, i) => {
    const p = i + 1, cls = p <= 3 ? 'p' + p : '';
    return `<tr class="${r.me ? 'me' : ''}">
      <td><span class="pos ${cls}">${p}</span></td>
      <td>${esc(r.name)}${r.me ? `<span class="youtag">${t('you')}</span>` : ''}</td>
      ${lapMode ? `<td class="num">${fmtLap(r.lap)}</td>`
                : `<td class="num">🏅 ${r.medals}</td><td class="num">${r.studies} / ${STUDIES.length}</td>`}
    </tr>`;
  }).join('');
  return head + `
    <div class="tabs">
      <button data-board="lap" class="${lapMode ? 'active' : ''}">${t('tab_lap')}</button>
      <button data-board="medals" class="${!lapMode ? 'active' : ''}">${t('tab_medals')}</button>
    </div>
    ${S.visible ? '' : `<div class="note">👻 ${t('hidden_note')}</div>`}
    <div class="board"><div class="cap">${lapMode ? t('cap_lap') : t('cap_medals')}</div>
      <table><thead><tr><th>${t('col_rank')}</th><th>${t('col_driver')}</th>
      ${lapMode ? `<th>${t('col_lap')}</th>` : `<th>${t('col_medals')}</th><th>${t('col_studies')}</th>`}
      </tr></thead><tbody>${body}</tbody></table></div>`;
}

function viewProfile(){
  const items = STUDIES.map(s => {
    const d = S.done[s.id];
    return `<div class="caseitem ${d ? '' : 'pending'}">
      <div><b>${s.icon} ${s.name}</b><br><small>${d ? new Date(d.date).toLocaleDateString(S.lang) : t('pending')}</small></div>
      <span class="medalrow">${medalRow(s.medals, !!d)}</span></div>`;
  }).join('');
  return `<h2 class="section-title">${t('prof_title')}</h2><p class="sub">&nbsp;</p>
    <div class="pgrid">
      <div class="panel">
        <label for="nick">${t('nick')}</label>
        <input type="text" id="nick" maxlength="16" value="${esc(S.nick)}">
        <label class="toggle"><input type="checkbox" id="visible" ${S.visible ? 'checked' : ''}> ${t('visible')}</label>
        <div class="stats">
          <div class="stat"><b>🏅 ${totalMedals()}</b><span>${t('stat_medals')}</span></div>
          <div class="stat"><b>${doneCount()}/${STUDIES.length}</b><span>${t('stat_studies')}</span></div>
          <div class="stat"><b>${S.best ? (S.best / 1000).toFixed(2) : '–'}</b><span>${t('stat_best')}</span></div>
        </div>
      </div>
      <div class="panel"><h3>${t('case_title')}</h3><div class="case">${items}</div></div>
    </div>`;
}

/* ---------- Study launch flow (simulated) ---------- */
function openStart(id){
  const s = STUDIES.find(x => x.id === id);
  const checks = [['time', t('m_time', {min:s.min})], ...s.req.map(r => [r, t('m_' + r)])];
  const url = `manylaps/index.html?module=${s.id}&lang=${S.lang}&session_seq=${doneCount() + 1}`;
  $('modal').innerHTML = `
    <h2>${s.icon} ${t('m_title', {name:s.name})}</h2>
    <p class="muted">${t('m_sub', {min:s.min, medals:s.medals})} ${medalRow(s.medals)}</p>
    <div class="checks">${checks.map(([k, l]) =>
      `<label class="toggle"><input type="checkbox" class="chk"> ${l}</label>`).join('')}</div>
    <div class="actions"><button class="btn ghost" data-close>${t('cancel')}</button>
      <button class="btn" id="go" disabled>${t('go')}</button></div>
    <div class="dev">→ ${url}</div>`;
  $('overlay').classList.add('open');
  const boxes = [...document.querySelectorAll('.chk')];
  boxes.forEach(b => b.onchange = () => $('go').disabled = !boxes.every(x => x.checked));
  $('go').onclick = () => runStudy(s);
}

function runStudy(s){
  const stages = [t('st1'), t('st2'), t('st3')];
  $('modal').innerHTML = `<div class="stage"><h2>${s.icon} ${s.name}</h2>
    <div class="bar"><i id="pbar" style="width:0%"></i></div><p class="muted" id="ptext">${stages[0]}</p></div>`;
  let p = 0;
  const iv = setInterval(() => {
    p += 4; $('pbar').style.width = p + '%';
    $('ptext').textContent = stages[Math.min(2, Math.floor(p / 34))];
    if (p >= 100) { clearInterval(iv); complete(s); }
  }, 70);
}

function complete(s){
  // Simulated best lap on ML Track A (slight improvement with experience)
  const lap = Math.round(41500 - doneCount() * 450 + (Math.random() - .5) * 3000);
  S.best = S.best == null ? lap : Math.min(S.best, lap);
  S.done[s.id] = { medals:s.medals, date:new Date().toISOString() };
  if (S.suggest === s.id || (STUDIES.find(x => x.id === S.suggest)?.firstOnly)) {
    const open = STUDIES.filter(x => !S.done[x.id] && !x.firstOnly).map(x => x.id);
    S.suggest = open.length ? open[Math.floor(Math.random() * open.length)] : null;
  }
  save();
  $('modal').innerHTML = `<div class="reward"><h2>${t('done_t')}</h2>
    <div class="medals">${Array.from({length:s.medals}, (_, i) =>
      `<span style="animation-delay:${i * .15}s">🏅</span>`).join('')}</div>
    <p class="muted">${t('done_d', {name:s.name})}</p>
    <div class="actions" style="justify-content:center"><button class="btn" data-close>${t('back')}</button></div></div>`;
  render();
  const mc = $('medalcount'); mc.classList.remove('bump'); void mc.offsetWidth; mc.classList.add('bump');
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-lang],[data-start],[data-board],[data-close]');
  if (e.target.id === 'overlay') { $('overlay').classList.remove('open'); return; }
  if (!el) return;
  if (el.dataset.tab)   { S.tab = el.dataset.tab; save(); render(); window.scrollTo(0, 0); }
  if (el.dataset.lang)  { S.lang = el.dataset.lang; save(); render(); }
  if (el.dataset.board) { S.boardTab = el.dataset.board; save(); render(); }
  if (el.dataset.start) openStart(el.dataset.start);
  if (el.hasAttribute('data-close')) $('overlay').classList.remove('open');
});
document.addEventListener('input', e => {
  if (e.target.id === 'nick') { S.nick = e.target.value.trim().slice(0, 16) || 'Driver'; save(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'visible') { S.visible = e.target.checked; save(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('overlay').classList.remove('open'); });
$('reset').onclick = () => { try { localStorage.removeItem(LS_KEY); } catch(_) {} S = fresh(); render(); };

render();
</script>
</body>
</html>
