<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmegaLab · Studien</title>
<!--
  MOCKUP UND PLAN, nicht die App. BESTELLT: "Nimm das Mockup (manylaps_opus) und baue es so,
  dass es in OmegaLab reinpasst. Statt einer einzelnen Studie soll eine Auswahl an vielen moeglich
  sein. Auf dem Auswahlbildschirm soll man sehen, was man braucht (immer 1 Auto zum Steuern,
  manchmal ein NPC, eine Strecke). Noch nicht einbauen, nur Mockup, wie es in OmegaSim aussaehe."

  Das Mockup uebernimmt das Konzept des ManyLaps-Hubs (Studien-Katalog, Fortschritt, Medaillen,
  Rangliste, Medaillensammlung) und passt es an OmegaSim an: die Farbe, Schrift und die Kachel-
  Sprache der App (Optionen > OmegaLab). Auf der Auswahlseite steht je Studie, was man braucht:

      [Fahrzeug] 1 Auto  -> immer, das Auto, das du steuerst
      [NPC]      1 NPC   -> nur, wenn ein weiteres (nicht gesteuertes) Auto auf der Strecke ist
      [Strecke]  Name    -> die Strecke samt dem Set, das du dafuer aufbauen musst

  Die Strecken und Sets stammen aus dem Challenge-Katalog (72-challenges.js). Alles ist simuliert:
  "Starten" zeigt nur einen Fortschrittsbalken. Kein Einbau in die App, keine Daten.
-->
<style>
  :root { --bg:#000; --panel:#0b0c0f; --panel-2:#14161c; --panel-3:#1d2028;
    --ink:#f4f6fb; --ink-2:#c9d1e0; --muted:#a9b2c4; --border:#262a33; --border-strong:#7d8698;
    --good:#3ddc84; --bad:#ff5c5c; --warn:#ffb02e; --info:#5aa9ff; --gold:#ffd34d;
    --tint-1:rgba(255,255,255,.035); --tint-2:rgba(255,255,255,.07); --tint-3:rgba(255,255,255,.12);
    color-scheme:dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:Calibri,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    line-height:1.45; font-size:15px; }
  button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  .wrap { max-width:1160px; margin:0 auto; padding:0 18px; }

  /* Header */
  header { position:sticky; top:0; z-index:20; background:rgba(0,0,0,.88); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border); }
  .hbar { display:flex; align-items:center; gap:16px; height:60px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.4px; }
  .omega { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-size:20px;
    background:linear-gradient(135deg,var(--info),#1c4f86); color:#fff; }
  .brand small { display:block; font-weight:500; color:var(--muted); font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; }
  nav { display:flex; gap:4px; margin-left:22px; }
  nav button { color:var(--muted); padding:8px 13px; border-radius:8px; font-weight:600; }
  nav button.active, nav button:hover { color:var(--ink); background:var(--panel-2); }
  .hright { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .medalcount { display:flex; align-items:center; gap:6px; background:var(--panel-2); padding:6px 12px;
    border-radius:999px; font-weight:700; border:1px solid var(--border); }
  .medalcount.bump { animation:bump .6s; }
  @keyframes bump { 40% { transform:scale(1.25); border-color:var(--gold); } }
  .lang { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .lang button { color:var(--muted); padding:6px 10px; font-weight:700; font-size:13px; }
  .lang button.active { background:var(--info); color:#fff; }

  /* Hero */
  .hero { padding:34px 0 16px; display:grid; grid-template-columns:1.4fr 1fr; gap:26px; align-items:end; }
  .hero h1 { font-size:30px; line-height:1.15; margin-bottom:8px; }
  .hero h1 span { color:var(--info); }
  .hero p { color:var(--muted); max-width:580px; }
  .progress { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .progress .lbl { font-size:13px; color:var(--muted); margin-bottom:10px; }
  .bar { height:10px; background:var(--panel-3); border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--info),var(--gold));
    border-radius:99px; transition:width .8s; }
  .progress .nums { display:flex; justify-content:space-between; margin-top:10px; font-weight:700; }

  .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:8px 0 20px; }
  .step { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 15px;
    display:flex; gap:11px; align-items:flex-start; }
  .step b { display:grid; place-items:center; min-width:26px; height:26px; border-radius:50%;
    background:var(--panel-3); color:var(--info); font-size:13px; }
  .step h4 { font-size:14px; margin-bottom:2px; }
  .step p { font-size:13px; color:var(--muted); }

  /* Cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; padding-bottom:30px; }
  .card { position:relative; background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--border); border-radius:12px; padding:18px; display:flex; flex-direction:column;
    gap:10px; transition:transform .15s,border-color .15s; }
  .card:hover { transform:translateY(-2px); border-color:var(--border-strong); }
  .card.done { border-color:var(--good); }
  .card.locked { opacity:.55; }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .icon { width:48px; height:48px; border-radius:10px; display:grid; place-items:center; font-size:24px;
    background:var(--bg); border:1px solid var(--border); }
  .ribbon { font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; padding:4px 8px; border-radius:6px; }
  .ribbon.sug { background:rgba(90,169,255,.15); color:var(--info); border:1px solid rgba(90,169,255,.5); }
  .ribbon.ok { background:rgba(61,220,132,.14); color:var(--good); border:1px solid rgba(61,220,132,.5); }
  .ribbon.lk { background:var(--tint-2); color:var(--muted); border:1px solid var(--border); }
  .card h3 { font-size:19px; }
  .desc { color:var(--muted); font-size:14px; flex:1; }
  .meta { display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:600; }
  .medalrow { letter-spacing:1px; }
  .medalrow .dim { filter:grayscale(1); opacity:.35; }

  /* Was du brauchst */
  .brauchst { border-top:1px dashed var(--border); padding-top:10px; }
  .brauchst .bl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;
    margin-bottom:7px; font-weight:700; }
  .reqs { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:4px 9px; border-radius:999px; background:var(--bg); border:1px solid var(--border);
    color:var(--ink-2); display:inline-flex; align-items:center; gap:5px; }
  .chip.must { border-color:var(--info); color:var(--info); background:rgba(90,169,255,.08); }
  .chip.npc { border-color:var(--warn); color:var(--warn); background:rgba(255,176,46,.08); }
  .chip.track { border-color:var(--border-strong); }
  .chip .small { font-size:10.5px; opacity:.75; }

  .btn { background:var(--info); color:#fff; font-weight:700; padding:10px 15px; border-radius:9px; transition:background .15s; }
  .btn:hover { background:#6cb5ff; }
  .btn:disabled { background:var(--panel-3); color:var(--muted); cursor:not-allowed; }
  .btn.ghost { background:var(--panel-2); color:var(--ink); }
  .btn.ghost:hover { background:var(--panel-3); }
  .note { font-size:13px; color:var(--muted); background:var(--panel); border:1px dashed var(--border);
    border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .note b { color:var(--ink); }

  /* Leaderboard */
  .section-title { font-size:24px; margin:30px 0 4px; }
  .sub { color:var(--muted); margin-bottom:18px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button { background:var(--panel); color:var(--muted); border:1px solid var(--border); padding:8px 15px; border-radius:9px; font-weight:700; }
  .tabs button.active { color:#fff; background:var(--info); border-color:var(--info); }
  .board { background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:26px; }
  .board .cap { padding:12px 16px; border-bottom:1px solid var(--border); color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:11px 16px; border-bottom:1px solid var(--border); font-size:14px; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700; }
  td.num { font-variant-numeric:tabular-nums; font-weight:700; }
  tr.me td { background:rgba(90,169,255,.1); }
  tr.me td:first-child { box-shadow:inset 3px 0 var(--info); }
  .pos { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:7px; background:var(--panel-3); font-weight:800; font-size:12px; }
  .p1 { background:rgba(255,211,77,.18); color:var(--gold); } .p2 { background:rgba(201,209,224,.15); color:#dfe5ef; } .p3 { background:rgba(205,127,50,.18); color:#e09a5c; }
  .youtag { font-size:11px; font-weight:800; background:var(--info); color:#fff; padding:2px 6px; border-radius:5px; margin-left:6px; }
  .lockpanel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:44px 18px; text-align:center; margin-bottom:26px; }
  .lockpanel .big { font-size:40px; margin-bottom:10px; }
  .lockpanel p { color:var(--muted); max-width:460px; margin:6px auto 16px; }

  /* Profile */
  .pgrid { display:grid; grid-template-columns:1fr 1.4fr; gap:16px; margin-bottom:26px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; }
  .panel h3 { margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input[type=text] { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--ink);
    padding:9px 11px; border-radius:8px; font:inherit; margin-bottom:12px; }
  .toggle { display:flex; align-items:center; gap:9px; font-size:14px; cursor:pointer; }
  .toggle input { width:17px; height:17px; accent-color:var(--info); }
  .case { display:grid; gap:9px; }
  .caseitem { display:flex; justify-content:space-between; align-items:center; padding:11px 13px; border-radius:9px;
    background:var(--bg); border:1px solid var(--border); }
  .caseitem.pending { opacity:.45; }
  .caseitem small { color:var(--muted); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:14px; }
  .stat { background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:11px; text-align:center; }
  .stat b { display:block; font-size:20px; }
  .stat span { font-size:12px; color:var(--muted); }

  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.82); display:none; place-items:center; z-index:50; padding:20px; }
  .overlay.open { display:grid; }
  .modal { background:var(--panel); border:1px solid var(--border); border-radius:16px; max-width:500px; width:100%; padding:24px;
    animation:pop .2s ease-out; }
  @keyframes pop { from { transform:scale(.95); opacity:0; } }
  .modal h2 { margin-bottom:6px; }
  .modal .muted { color:var(--muted); font-size:14px; margin-bottom:14px; }
  .checks { display:grid; gap:10px; margin:12px 0 16px; }
  .actions { display:flex; gap:10px; justify-content:flex-end; }
  .dev { font-family:ui-monospace,monospace; font-size:11px; color:var(--muted); margin-top:12px; word-break:break-all; }
  .stage { text-align:center; padding:14px 0; }
  .stage .bar { margin:16px 0 10px; }
  .reward { text-align:center; padding:10px 0; }
  .reward .medals { font-size:38px; letter-spacing:6px; margin:12px 0; }
  .reward .medals span { display:inline-block; animation:drop .5s backwards; }
  @keyframes drop { from { transform:translateY(-28px) scale(.4); opacity:0; } }

  footer { border-top:1px solid var(--border); padding:16px 0 28px; color:var(--muted); font-size:12px; }
  footer .wrap { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .mock { background:rgba(255,211,77,.16); color:var(--gold); padding:3px 8px; border-radius:6px; font-weight:700; margin-right:8px; }

  @media(max-width:840px){
    .hero { grid-template-columns:1fr; } .steps { grid-template-columns:1fr; } .pgrid { grid-template-columns:1fr; }
    nav { margin-left:0; } .brand small { display:none; } .hbar { gap:9px; } nav button { padding:8px 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="brand"><div class="omega">Ω</div><div>OmegaLab<small>Studien</small></div></div>
    <nav id="nav"></nav>
    <div class="hright">
      <div class="medalcount" id="medalcount">🏅 <span>0</span></div>
      <div class="lang" id="lang"><button data-lang="de">DE</button><button data-lang="en">EN</button></div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<footer>
  <div class="wrap">
    <div><span class="mock">MOCKUP</span><span id="foot"></span></div>
    <button class="btn ghost" id="reset" style="padding:6px 11px;font-size:12px"></button>
  </div>
</footer>

             strecke = Name + Set, das du aufbauen musst. */
const STUDIES = [
  { id:'ridge',    name:'Ridge Run',       icon:'⛰️', strecke:'Homington',      set:'Grundpackung',                        laps:5,  npc:false, min:15 },
  { id:'lakeside', name:'Lakeside Loop',   icon:'🌊', strecke:'Homington',      set:'Grundpackung',                        laps:5,  npc:true,  min:20 },
  { id:'paddock',  name:'Paddock Session', icon:'🧩', strecke:'Circuit Du Sol', set:'Grundpackung + Haarnadel-Set',        laps:6,  npc:false, min:25 },

  { id:'sprint',   name:'Sprint Series',   icon:'⚡', strecke:'Suzuna',         set:'Grundpackung',                        laps:8,  npc:true,  min:32 },

// Medaillen spiegeln nur die Zeit (nie die Leistung): bis 20 Min. 3 | 21-26: 4 | ab 27: 5
const medalsFor = m => m <= 20 ? 3 : m <= 26 ? 4 : 5;
STUDIES.forEach(s => s.medals = medalsFor(s.min));
const MAX_MEDALS = STUDIES.reduce((a, s) => a + s.medals, 0);
// Gewichte fuer den "Empfohlen"-Badge (nur Anzeige, damit nicht jede Karte gleich aussieht)

  pending:'Not yet completed',
  m_title:'Start “{name}”?', m_sub:'About {min} minutes · {medals} medals on completion',
  m_time:'I have about {min} minutes without interruptions.',
  m_auto:'My car is on the start/finish line of the track.',
  m_npc:'I have a second car that drives along as an NPC.',
  m_track:'The track is built from the set shown.',
  cancel:'Cancel', go:'Start', st1:'Loading circuit…', st2:'Driving…', st3:'Saving data…',
  done_t:'Study complete!', done_d:'“{name}” has been added to your medal case.', back:'Back to studies',
  reset:'Reset demo', foot:'Studies are simulated. In production, “Start” opens the study in the app.'
}};

/* ---------- Fake leaderboard data ---------- */
const FAKE = [
  ['apex_anna',36912,25,6],['LateBraker',37455,21,5],['Nordschleife',37803,25,6],['slipstream',38120,12,3],
  ['Mira K.',38544,17,4],['torque_tom',38990,9,2],['Bergfahrt',39310,22,5],['pitwall_pia',39788,8,2],
  ['Drift König',40215,13,3],['Lea_R',40870,4,1],['RC_Max',41466,16,4],['kurvenkratzer',42301,5,1],
  ['quietcorner',43050,3,1],['Ω-rookie',44210,4,1]
].map(([name, lap, medals, studies]) => ({ name, lap, medals, studies }));

/* ---------- State ---------- */
const LS_KEY = 'omegalab_hub_mock_v1';
function pickSuggest(){
  let r = Math.random() * Object.values(WEIGHTS).reduce((a, b) => a + b, 0);
  for (const [k, w] of Object.entries(WEIGHTS)) { if ((r -= w) < 0) return k; }
  return 'ridge';
}
function fresh(){
  return { lang:(navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en',
           done:{}, best:null, visible:true, tab:'studies', boardTab:'lap', suggest:pickSuggest(),
           nick:'Driver-' + Math.random().toString(16).slice(2, 6).toUpperCase() };
}
let S;
try { S = JSON.parse(localStorage.getItem(LS_KEY)) || fresh(); } catch(e) { S = fresh(); }
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} };

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(key, vars = {}){
  let s = (T[S.lang][key] ?? T.en[key] ?? key);
  for (const [k, v] of Object.entries(vars)) s = s.replaceAll('{' + k + '}', v);
  return s;
}
const fmtLap = ms => ms == null ? '–' : (ms / 1000).toFixed(3) + ' s';
const doneCount = () => Object.keys(S.done).length;
const totalMedals = () => Object.values(S.done).reduce((a, d) => a + d.medals, 0);
const medalRow = (n, earned = true) => Array.from({length:n}, () =>
  `<span class="${earned ? '' : 'dim'}">🏅</span>`).join('');

/* ---------- Was du brauchst: Kacheln fuer Auto / NPC / Strecke ---------- */
function reqHtml(s){
  const chips = [
    `<span class="chip must" title="${esc(t('leg_auto'))}">🚗 ${esc(t('auto'))} <span class="small">· ${esc(t('always'))}</span></span>`
  ];
  if (s.npc) chips.push(`<span class="chip npc" title="${esc(t('leg_npc'))}">🤖 ${esc(t('npc'))}</span>`);
  chips.push(`<span class="chip track" title="${esc(t('leg_track'))}">🏁 ${esc(t('track'))}: ${esc(s.strecke)} <span class="small">· ${esc(s.set)}</span></span>`);
  return `<div class="brauchst"><div class="bl">${esc(t('need_title'))}</div><div class="reqs">${chips.join('')}</div></div>`;
}

/* ---------- Render ---------- */
function render(){
  document.documentElement.lang = S.lang;
  $('nav').innerHTML = ['studies', 'board', 'profile'].map(v =>
    `<button data-tab="${v}" class="${S.tab === v ? 'active' : ''}">${t('nav_' + v)}</button>`).join('');
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === S.lang));
  $('medalcount').querySelector('span').textContent = totalMedals();
  $('foot').textContent = t('foot');
  $('reset').textContent = t('reset');
  $('main').innerHTML = S.tab === 'studies' ? viewStudies() : S.tab === 'board' ? viewBoard() : viewProfile();
}

function viewStudies(){
  const d = doneCount(), m = totalMedals();
  const cards = STUDIES.map(s => {
    const done = S.done[s.id];
    const sug = !done && S.suggest === s.id;
    const ribbon = done ? `<span class="ribbon ok">✓ ${t('completed')}</span>`
                 : sug ? `<span class="ribbon sug">★ ${t('suggested')}</span>` : '';
    const btn = done ? `<button class="btn" disabled>${t('earned', {m:done.medals})}</button>`
              : `<button class="btn" data-start="${s.id}">${t('start')} →</button>`;
    return `<article class="card ${done ? 'done' : ''}">
      <div class="card-top"><div class="icon">${s.icon}</div>${ribbon}</div>
      <h3>${s.name}</h3>
      <p class="desc">${t('d_' + s.id)}</p>
      <div class="meta"><span>⏱ ≈ ${s.min} ${t('min')} · ${t('laps', {n:s.laps})}</span><span class="medalrow">${medalRow(s.medals, !!done)}</span></div>
      ${reqHtml(s)}
      ${btn}
    </article>`;
  }).join('');
  return `
    <section class="hero">
      <div><h1>${t('hero_title')}</h1><p>${t('hero_sub')}</p></div>
      <div class="progress">
        <div class="lbl">${t('progress')}</div>
        <div class="bar"><i style="width:${100 * m / MAX_MEDALS}%"></i></div>
        <div class="nums"><span>${t('studies_of', {d, n:STUDIES.length})}</span><span>🏅 ${t('medals_of', {m, M:MAX_MEDALS})}</span></div>
      </div>
    </section>
    <div class="steps">
      <div class="step"><b>1</b><div><h4>${t('s1_t')}</h4><p>${t('s1_d')}</p></div></div>
      <div class="step"><b>2</b><div><h4>${t('s2_t')}</h4><p>${t('s2_d')}</p></div></div>
      <div class="step"><b>3</b><div><h4>${t('s3_t')}</h4><p>${t('s3_d')}</p></div></div>
    </div>
    <div class="note">ℹ️ ${d === 0 ? t('first_visit') + ' ' : ''}${t('rule')}${d > 0 ? '<br>☕ ' + t('break_hint') : ''}</div>
    <section class="grid">${cards}</section>`;
}

function viewBoard(){
  const head = `<h2 class="section-title">${t('board_title')}</h2><p class="sub">${t('board_sub')}</p>`;
  if (doneCount() === 0) return head + `
    <div class="lockpanel"><div class="big">🔒</div><h3>${t('board_locked_t')}</h3>
      <p>${t('board_locked_d')}</p><button class="btn" data-tab="studies">${t('board_go')}</button></div>`;
  const me = { name:S.nick, lap:S.best, medals:totalMedals(), studies:doneCount(), me:true };
  let rows = [...FAKE]; if (S.visible) rows.push(me);
  const lapMode = S.boardTab === 'lap';
  rows.sort(lapMode ? (a, b) => a.lap - b.lap : (a, b) => b.medals - a.medals || b.studies - a.studies);
  const body = rows.map((r, i) => {
    const p = i + 1, cls = p <= 3 ? 'p' + p : '';
    return `<tr class="${r.me ? 'me' : ''}">
      <td><span class="pos ${cls}">${p}</span></td>
      <td>${esc(r.name)}${r.me ? `<span class="youtag">${t('you')}</span>` : ''}</td>
      ${lapMode ? `<td class="num">${fmtLap(r.lap)}</td>`
                : `<td class="num">🏅 ${r.medals}</td><td class="num">${r.studies} / ${STUDIES.length}</td>`}
    </tr>`;
  }).join('');
  return head + `
    <div class="tabs">
      <button data-board="lap" class="${lapMode ? 'active' : ''}">${t('tab_lap')}</button>
      <button data-board="medals" class="${!lapMode ? 'active' : ''}">${t('tab_medals')}</button>
    </div>
    ${S.visible ? '' : `<div class="note">👻 ${t('hidden_note')}</div>`}
    <div class="board"><div class="cap">${lapMode ? t('cap_lap') : t('cap_medals')}</div>
      <table><thead><tr><th>${t('col_rank')}</th><th>${t('col_driver')}</th>
      ${lapMode ? `<th>${t('col_lap')}</th>` : `<th>${t('col_medals')}</th><th>${t('col_studies')}</th>`}
      </tr></thead><tbody>${body}</tbody></table></div>`;
}

function viewProfile(){
  const items = STUDIES.map(s => {
    const d = S.done[s.id];
    return `<div class="caseitem ${d ? '' : 'pending'}">
      <div><b>${s.icon} ${s.name}</b><br><small>${d ? new Date(d.date).toLocaleDateString(S.lang) : t('pending')}</small></div>
      <span class="medalrow">${medalRow(s.medals, !!d)}</span></div>`;
  }).join('');
  return `<h2 class="section-title">${t('prof_title')}</h2><p class="sub">&nbsp;</p>
    <div class="pgrid">
      <div class="panel">
        <label for="nick">${t('nick')}</label>
        <input type="text" id="nick" maxlength="16" value="${esc(S.nick)}">
        <label class="toggle"><input type="checkbox" id="visible" ${S.visible ? 'checked' : ''}> ${t('visible')}</label>
        <div class="stats">
          <div class="stat"><b>🏅 ${totalMedals()}</b><span>${t('stat_medals')}</span></div>
          <div class="stat"><b>${doneCount()}/${STUDIES.length}</b><span>${t('stat_studies')}</span></div>
          <div class="stat"><b>${S.best ? (S.best / 1000).toFixed(2) : '–'}</b><span>${t('stat_best')}</span></div>
        </div>
      </div>
      <div class="panel"><h3>${t('case_title')}</h3><div class="case">${items}</div></div>
    </div>`;
}

/* ---------- Study launch flow (simulated) ---------- */
function openStart(id){
  const s = STUDIES.find(x => x.id === id);
  const checks = [['time', t('m_time', {min:s.min})], ['auto', t('m_auto')], ['track', t('m_track')]];
  if (s.npc) checks.push(['npc', t('m_npc')]);
  const url = `../index.html?studie=${s.id}&lang=${S.lang}&session_seq=${doneCount() + 1}`;
  $('modal').innerHTML = `
    <h2>${s.icon} ${t('m_title', {name:s.name})}</h2>
    <p class="muted">${t('m_sub', {min:s.min, medals:s.medals})} ${medalRow(s.medals)}</p>
    <div class="checks">${checks.map(([k, l]) =>
      `<label class="toggle"><input type="checkbox" class="chk"> ${l}</label>`).join('')}</div>
    <div class="actions"><button class="btn ghost" data-close>${t('cancel')}</button>
      <button class="btn" id="go" disabled>${t('go')}</button></div>
    <div class="dev">→ ${url}</div>`;
  $('overlay').classList.add('open');
  const boxes = [...document.querySelectorAll('.chk')];
  boxes.forEach(b => b.onchange = () => $('go').disabled = !boxes.every(x => x.checked));
  $('go').onclick = () => runStudy(s);
}

function runStudy(s){
  const stages = [t('st1'), t('st2'), t('st3')];
  $('modal').innerHTML = `<div class="stage"><h2>${s.icon} ${s.name}</h2>
    <div class="bar"><i id="pbar" style="width:0%"></i></div><p class="muted" id="ptext">${stages[0]}</p></div>`;
  let p = 0;
  const iv = setInterval(() => {
    p += 4; $('pbar').style.width = p + '%';
    $('ptext').textContent = stages[Math.min(2, Math.floor(p / 34))];
    if (p >= 100) { clearInterval(iv); complete(s); }
  }, 70);
}

function complete(s){
  // Simulierte beste Runde auf der Strecke (leichte Verbesserung mit Erfahrung)
  const lap = Math.round(41500 - doneCount() * 450 + (Math.random() - .5) * 3000);
  S.best = S.best == null ? lap : Math.min(S.best, lap);
  S.done[s.id] = { medals:s.medals, date:new Date().toISOString() };
  if (S.suggest === s.id) {
    const open = STUDIES.filter(x => !S.done[x.id]).map(x => x.id);
    S.suggest = open.length ? open[Math.floor(Math.random() * open.length)] : null;
  }
  save();
  $('modal').innerHTML = `<div class="reward"><h2>${t('done_t')}</h2>
    <div class="medals">${Array.from({length:s.medals}, (_, i) =>
      `<span style="animation-delay:${i * .15}s">🏅</span>`).join('')}</div>
    <p class="muted">${t('done_d', {name:s.name})}</p>
    <div class="actions" style="justify-content:center"><button class="btn" data-close>${t('back')}</button></div></div>`;
  render();
  const mc = $('medalcount'); mc.classList.remove('bump'); void mc.offsetWidth; mc.classList.add('bump');
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-lang],[data-start],[data-board],[data-close]');
  if (e.target.id === 'overlay') { $('overlay').classList.remove('open'); return; }
  if (!el) return;
  if (el.dataset.tab)   { S.tab = el.dataset.tab; save(); render(); window.scrollTo(0, 0); }
  if (el.dataset.lang)  { S.lang = el.dataset.lang; save(); render(); }
  if (el.dataset.board) { S.boardTab = el.dataset.board; save(); render(); }
  if (el.dataset.start) openStart(el.dataset.start);
  if (el.hasAttribute('data-close')) $('overlay').classList.remove('open');
});
document.addEventListener('input', e => {
  if (e.target.id === 'nick') { S.nick = e.target.value.trim().slice(0, 16) || 'Driver'; save(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'visible') { S.visible = e.target.checked; save(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('overlay').classList.remove('open'); });
$('reset').onclick = () => { try { localStorage.removeItem(LS_KEY); } catch(_) {} S = fresh(); render(); };

render();
</script>
</body>
</html>
